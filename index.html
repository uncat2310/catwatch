<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>薛定谔的项目</title>
  <meta name="description" content="薛定谔的项目 · 心之所向，触手可及" />
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="薛定谔的项目" />
  <meta name="theme-color" content="#f0eee6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/avatar.jpg" />

  <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var theme = params.get('theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'auto') {
          var raw = localStorage.getItem('SCHRODINGER_PORTAL') || localStorage.getItem('SCHRODINGER_PORTAL_V18');
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = parsed && parsed.settings && parsed.settings.theme;
          }
        }
        if (theme !== 'light' && theme !== 'dark' && theme !== 'auto') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'auto' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme || 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app" class="app-container">
    <header class="masthead">
      <div class="profile-brand">
        <div class="avatar-box" id="headerAvatar">
          <img src="/avatar.jpg" alt="" class="avatar-img" width="44" height="44" />
        </div>
        <div class="brand-text">
          <p class="masthead-eyebrow">
            <span id="greetingText">欢迎回来</span><span class="eyebrow-sep" aria-hidden="true">/</span><span id="clockDate"></span><span class="eyebrow-clock"><span class="eyebrow-sep" aria-hidden="true">/</span><span id="clockTime" class="clock-time"></span></span>
          </p>
          <h1 class="brand-title" id="headerTitle">薛定谔的项目</h1>
          <p class="brand-subtitle" id="headerSubtitle">心之所向，触手可及</p>
        </div>
      </div>

      <div class="header-actions">
        <button class="search-trigger-btn" id="searchTriggerBtn" type="button" title="搜索服务 (Ctrl + K)">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="search-btn-label">搜索</span>
          <kbd class="kbd-badge">Ctrl K</kbd>
        </button>

        <div class="theme-dropdown-wrapper">
          <button class="icon-circle-btn" id="themeBtn" type="button" title="外观" aria-label="外观">
            <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"></path>
            </svg>
          </button>
          <div class="theme-menu" id="themeMenu">
            <button class="theme-option active" data-theme-val="light" type="button">浅色</button>
            <button class="theme-option" data-theme-val="dark" type="button">深色</button>
            <button class="theme-option" data-theme-val="auto" type="button">跟随系统</button>
          </div>
        </div>

        <button class="icon-circle-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>

        <button class="btn btn-primary" id="addProjectBtn" type="button" aria-label="添加服务">
          <svg class="btn-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>添加</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="project-pool" id="projectPool">
        <!-- Rendered dynamically -->
      </section>
    </main>

    <footer class="app-footer">
      <div class="footer-content">
        <span class="footer-copy">© 2026 薛定谔的项目</span>
        <a href="/status" class="footer-link">公开状态页</a>
        <a href="https://github.com/uncat2310/schrodinger-portal" target="_blank" rel="noreferrer" class="footer-link" id="footerGithubLink">GitHub</a>
      </div>
    </footer>
  </div>

  <!-- MODAL: Add / Edit Project (Ultra-Clean: Title + URL + Auto-Favicon) -->
  <div class="modal-overlay" id="projectModalOverlay" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle">
    <div class="modal-card" id="projectModalCard">
      <div class="modal-drag-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="projectModalTitle">添加服务</h2>
        <button class="modal-close-btn" id="closeProjectModalBtn">&times;</button>
      </div>
      <form id="projectForm" class="modal-form">
        <input type="hidden" id="formProjectId" />

        <div class="form-group">
          <label for="formTitle" class="form-label">服务名称 <span class="required">*</span></label>
          <input type="text" id="formTitle" class="form-input" placeholder="输入服务名称" required />
        </div>

        <div class="form-group">
          <label for="formCustomWan" class="form-label">直达访问 URL <span class="required">*</span></label>
          <input type="url" id="formCustomWan" class="form-input font-mono" placeholder="https://" pattern="https?://.*" required />
        </div>

        <div class="form-group-checkbox">
          <label class="checkbox-container">
            <input type="checkbox" id="formPing" checked />
            <span class="checkmark"></span>
            <span class="checkbox-label">启用健康探针 (自动检测服务在线状态与时延)</span>
          </label>
        </div>

        <div class="form-group-checkbox" id="statusPublicGroup" hidden>
          <label class="checkbox-container">
            <input type="checkbox" id="formStatusPublic" />
            <span class="checkmark"></span>
            <span class="checkbox-label">在公开状态页 /status 显示 (仅名称与可用率，不含链接)</span>
          </label>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelProjectBtn">取消</button>
          <button type="submit" class="btn btn-primary" id="saveProjectBtn">保存服务</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: Global Search (Ctrl + K) -->
  <div class="modal-overlay" id="searchModalOverlay" role="dialog" aria-modal="true" aria-label="搜索服务">
    <div class="search-palette-box" id="searchPaletteBox">
      <div class="search-input-header">
        <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="paletteSearchInput" class="palette-input" placeholder="搜索服务..." autocomplete="off" />
        <kbd class="kbd-badge" id="closeSearchKbdBtn">ESC 退出</kbd>
      </div>
      <div class="search-results-list" id="searchResultsList">
        <!-- Results rendered here -->
      </div>
      <div class="search-footer-hint">
        <span>↑ ↓ 导航</span>
        <span>↵ 打开服务</span>
        <span>点击外部或 ESC 退出</span>
      </div>
    </div>
  </div>

  <!-- MODAL: Settings -->
  <div class="modal-overlay" id="settingsModalOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
    <div class="modal-card modal-card-lg" id="settingsModalCard">
      <div class="modal-drag-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="settingsModalTitle">个性化设置</h2>
        <button class="modal-close-btn" id="closeSettingsModalBtn">&times;</button>
      </div>
      <div class="settings-body">
        <div class="settings-section">
          <div class="form-row form-row-2">
            <div class="form-group">
              <label for="cfgTitle" class="form-label">主页名称</label>
              <input type="text" id="cfgTitle" class="form-input" value="薛定谔的项目" />
            </div>
            <div class="form-group">
              <label for="cfgSubtitle" class="form-label">副标题标语</label>
              <input type="text" id="cfgSubtitle" class="form-input" value="心之所向，触手可及" />
            </div>
          </div>
        </div>

        <div class="settings-section admin-section" id="adminStatus">
          <div class="form-label">服务器同步</div>
          <p class="admin-status-text">本地模式：修改只保存在当前浏览器。</p>
          <div class="admin-actions">
            <button type="button" class="btn btn-secondary btn-sm" id="adminLoginBtn" hidden>输入管理口令</button>
            <button type="button" class="btn btn-secondary btn-sm" id="notifyTestBtn" hidden>发送测试通知</button>
            <button type="button" class="btn btn-secondary btn-sm" id="adminLogoutBtn" hidden>退出管理</button>
          </div>
          <div class="admin-migrate" id="migrateRow" hidden>
            <span class="migrate-text"></span>
            <div class="admin-actions">
              <button type="button" class="btn btn-secondary btn-sm" id="migrateLocalBtn">上传到服务器</button>
              <button type="button" class="btn btn-secondary btn-sm" id="discardLocalBtn">丢弃</button>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" id="cancelSettingsBtn">取消</button>
        <button type="button" class="btn btn-primary" id="saveSettingsBtn">保存设置</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Admin Token -->
  <div class="modal-overlay" id="authModalOverlay" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <div class="modal-card" id="authModalCard">
      <div class="modal-drag-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 class="modal-title" id="authModalTitle">管理口令</h2>
        <button class="modal-close-btn" id="closeAuthModalBtn">&times;</button>
      </div>
      <form id="authForm" class="modal-form">
        <div class="form-group">
          <label for="authTokenInput" class="form-label">修改会写入服务器，请输入服务端配置的 ADMIN_TOKEN</label>
          <input type="password" id="authTokenInput" class="form-input font-mono" autocomplete="current-password" required />
          <p class="form-error" id="authError" role="alert"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancelAuthBtn">取消</button>
          <button type="submit" class="btn btn-primary">确认</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
