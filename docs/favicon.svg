<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Apple Squircle Gradient -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <!-- Cat Face Gradient (Warm Orange/Ginger) -->
    <linearGradient id="catGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7e40"/>
    </linearGradient>
    <!-- Inner Ear Pink -->
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8da1"/>
      <stop offset="100%" stop-color="#ff5e7e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Apple Squircle Canvas -->
  <rect width="100" height="100" rx="22" fill="url(#squircleBg)" filter="url(#shadow)"/>

  <!-- Left Ear -->
  <polygon points="26,46 36,18 52,35" fill="url(#catGrad)"/>
  <polygon points="30,42 38,24 48,36" fill="url(#earPink)"/>

  <!-- Right Ear -->
  <polygon points="74,46 64,18 48,35" fill="url(#catGrad)"/>
  <polygon points="70,42 62,24 52,36" fill="url(#earPink)"/>

  <!-- Cat Head Base -->
  <ellipse cx="50" cy="58" rx="34" ry="28" fill="url(#catGrad)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="28" cy="64" rx="5" ry="3.5" fill="#ff5277" opacity="0.35"/>
  <ellipse cx="72" cy="64" rx="5" ry="3.5" fill="#ff5277" opacity="0.35"/>

  <!-- Eyes -->
  <ellipse cx="38" cy="52" rx="3.8" ry="4.5" fill="#2c2c2e"/>
  <circle cx="39.5" cy="50.5" r="1.3" fill="#ffffff"/>
  
  <ellipse cx="62" cy="52" rx="3.8" ry="4.5" fill="#2c2c2e"/>
  <circle cx="63.5" cy="50.5" r="1.3" fill="#ffffff"/>

  <!-- Nose -->
  <polygon points="50,60 47,57 53,57" fill="#ff5e7e"/>

  <!-- Mouth -->
  <path d="M45,63 Q50,68 50,63 Q50,68 55,63" fill="none" stroke="#2c2c2e" stroke-width="2" stroke-linecap="round"/>

  <!-- Whiskers -->
  <line x1="16" y1="57" x2="28" y2="59" stroke="#ff7e40" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="18" y1="64" x2="28" y2="63" stroke="#ff7e40" stroke-width="1.8" stroke-linecap="round"/>

  <line x1="84" y1="57" x2="72" y2="59" stroke="#ff7e40" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="82" y1="64" x2="72" y2="63" stroke="#ff7e40" stroke-width="1.8" stroke-linecap="round"/>
</svg>
