<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>服务状态 · 猫咪值班室</title>
  <meta name="description" content="猫咪值班室 · 公开服务状态" />
  <meta name="theme-color" content="#f0eee6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <script>
    (function () {
      try {
        var theme = new URLSearchParams(location.search).get('theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'auto') {
          var raw = localStorage.getItem('SCHRODINGER_PORTAL');
          var parsed = raw && JSON.parse(raw);
          theme = parsed && parsed.settings && parsed.settings.theme;
        }
        if (theme !== 'light' && theme !== 'dark' && theme !== 'auto') theme = 'auto';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'auto');
      }
    })();
  </script>

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="app-container status-container">
    <header class="status-header">
      <div class="profile-brand">
        <div class="avatar-box">
          <!-- 走 /assets/：公开状态页可能挂在访问控制后面，只放行了 /assets/* -->
          <img src="./src/assets/avatar-160.jpg" alt="" class="avatar-img" width="44" height="44" />
        </div>
        <div class="brand-text">
          <div class="status-title-row">
            <h1 class="brand-title">猫咪值班室</h1>
            <span class="status-page-tag">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
              </svg>
              服务状态
            </span>
          </div>
          <p class="brand-subtitle">这些服务有猫在值班，每分钟自动刷新</p>
        </div>
      </div>
    </header>

    <main class="status-main" id="statusRoot"></main>

    <footer class="app-footer">
      <div class="footer-content">
        <span class="footer-copy">猫咪值班室</span>
        <span id="statusUpdated"></span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/status.js"></script>
</body>
</html>
